name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - run: npm ci
        working-directory: playwright
      - run: npx playwright install --with-deps chromium
        working-directory: playwright
      - run: npx playwright test
        working-directory: playwright
        env:
          CI: true

  cypress:
    name: Cypress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cypress/package-lock.json
      - run: npm ci
        working-directory: cypress
      - name: Run Cypress
        working-directory: cypress
        env:
          CI: true
          BASE_URL: http://127.0.0.1:3000
        run: |
          node ../app/server.js &
          npx --yes wait-on http://127.0.0.1:3000/api/health
          npx cypress run

  selenium:
    name: Selenium / C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: browser-actions/setup-chrome@v1
      - name: Run Selenium
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          node app/server.js &
          npx --yes wait-on http://127.0.0.1:3000/api/health
          dotnet test selenium-csharp/Kestrel.Automation.sln --nologo
