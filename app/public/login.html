<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Kestrel Outfitters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="login">
  <div data-chrome></div>
  <div class="wrap page-hero">
    <p class="eyebrow">Account</p>
    <h1>Sign in</h1>
  </div>
  <div class="wrap" style="padding-bottom: 72px;">
    <div class="credentials" data-testid="demo-credentials">
      <p class="eyebrow">Seeded shop accounts</p>
      <p>Standard: <code>standard@kestrel.test</code> / <code>Trailhead!23</code></p>
      <p>Locked: <code>locked@kestrel.test</code> / <code>Trailhead!23</code></p>
    </div>
    <form class="form" data-testid="login-form">
      <label>Email <input type="email" name="email" data-testid="login-email" autocomplete="username" required></label>
      <label>Password <input type="password" name="password" data-testid="login-password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" data-testid="login-submit">Sign in</button>
      <div class="flash" data-testid="flash" role="status"></div>
      <p class="note">New to the shop? <a href="/register.html" data-testid="register-link">Create an account</a></p>
    </form>
  </div>
  <div data-footer></div>
  <script type="module" src="/js/kestrel.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
