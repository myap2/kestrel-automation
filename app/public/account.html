<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account · Kestrel Outfitters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="account">
  <div data-chrome></div>
  <div class="wrap page-hero">
    <p class="eyebrow">Account</p>
    <h1 data-testid="account-heading">Your bench</h1>
  </div>
  <div class="wrap" style="padding-bottom: 72px;">
    <p>Signed in as <strong data-testid="account-name"></strong></p>
    <p class="note" data-testid="account-email"></p>
    <p><button class="btn btn-ghost" type="button" data-testid="logout-button">Sign out</button></p>
  </div>
  <div data-footer></div>
  <script type="module" src="/js/kestrel.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
